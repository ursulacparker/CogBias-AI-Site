<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CogBias product feature overview</title>
  <desc id="desc">A biased survey question appears above three CogBias interface panels showing explained biases, bias scoring, and a neutral rephrase.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <symbol id="cogbias-mark" viewBox="0 0 24 24">
      <path d="M12 2.5a9.5 9.5 0 0 1 8.2 4.7" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M20.2 7.2a9.5 9.5 0 0 1 .1 9.4" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M20.3 16.6a9.5 9.5 0 0 1-8.1 4.9" fill="none" stroke="#8b5cf6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M12.2 21.5a9.5 9.5 0 0 1-8.3-4.6" fill="none" stroke="#06b6d4" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M3.9 16.9a9.5 9.5 0 0 1-.2-9.4" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M3.7 7.5A9.5 9.5 0 0 1 12 2.5" fill="none" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8 9.2a5 5 0 1 1 1.1 7.2" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="1.7" fill="#ffffff"/>
    </symbol>
    <symbol id="thumb-down" viewBox="0 0 24 24">
      <path d="M15.8 3.3H7.4c-.8 0-1.5.5-1.9 1.2l-3 6.6c-.1.3-.2.6-.2.9v1.9c0 1.1.9 2 2 2h5.5l-.8 4.2c-.1.6.1 1.2.5 1.6l.8.8 6.2-6.3c.4-.4.6-.9.6-1.4V5.3c0-1.1-.5-2-1.3-2Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17.1 4.1h4v11.3h-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1200" height="700" rx="30" fill="url(#page)"/>
  <circle cx="1125" cy="40" r="130" fill="#c7d2fe" opacity="0.45"/>
  <circle cx="50" cy="695" r="150" fill="#ddd6fe" opacity="0.35"/>

  <!-- Source question -->
  <text x="600" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#4f46e5">START WITH A QUESTION</text>
  <g filter="url(#shadow)">
    <rect x="145" y="68" width="910" height="112" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="168" y="88" width="126" height="24" rx="12" fill="#ef4444" fill-opacity="0.14"/>
  <circle cx="190" cy="100" r="5" fill="#ef4444"/>
  <text x="202" y="104" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Biased question</text>
  <text x="168" y="144" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="650" fill="#1e293b">“Don’t you agree that our improved product is easier to use?”</text>
  <rect x="168" y="153" width="555" height="7" rx="3.5" fill="#bfdbfe"/>
  <circle cx="1015" cy="124" r="22" fill="#eef2ff"/>
  <path d="M1007 124h16m-6-6 6 6-6 6" fill="none" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connectors -->
  <path d="M600 180v23M216 203h768M216 203v20M600 203v20M984 203v20" fill="none" stroke="#c7d2fe" stroke-width="2"/>
  <circle cx="600" cy="203" r="5" fill="#4f46e5"/>

  <!-- Labels -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="101" y="221" width="230" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="216" y="242" font-size="13" font-weight="750" fill="#3730a3">The biases, explained</text>
    <rect x="485" y="221" width="230" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="600" y="242" font-size="13" font-weight="750" fill="#3730a3">Bias scoring</text>
    <rect x="869" y="221" width="230" height="32" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="984" y="242" font-size="13" font-weight="750" fill="#3730a3">The rephrase</text>
  </g>

  <!-- Panel 1: biases explained -->
  <g filter="url(#shadow)">
    <rect x="50" y="272" width="332" height="378" rx="17" fill="#e8edf3" stroke="#cbd5e1"/>
  </g>
  <path d="M67 272h298a17 17 0 0 1 17 17v31H50v-31a17 17 0 0 1 17-17Z" fill="#0647f5"/>
  <path d="M359 290l11 11m0-11-11 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="69" y="354" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" fill="#202124">3 biases found</text>

  <rect x="69" y="373" width="294" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <use href="#thumb-down" x="78" y="386" width="23" height="23" color="#c5221f"/>
  <text x="108" y="404" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#202124">Leading Question</text>
  <path d="M344 398l5 5 5-5" fill="none" stroke="#202124" stroke-width="1.8" stroke-linecap="round"/>
  <text x="82" y="430" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4b5563">“Don’t you agree” nudges respondents</text>
  <text x="82" y="447" font-family="Inter, Arial, sans-serif" font-size="11" fill="#4b5563">toward agreement before they answer.</text>
  <rect x="82" y="456" width="144" height="16" rx="8" fill="#fee2e2"/>
  <text x="92" y="468" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" fill="#b91c1c">HIGH INFLUENCE · 92%</text>

  <g font-family="Inter, Arial, sans-serif" font-size="12" font-weight="650" fill="#30343b">
    <line x1="69" y1="492" x2="363" y2="492" stroke="#cbd5e1"/>
    <use href="#thumb-down" x="78" y="504" width="23" height="23" color="#c5221f"/>
    <text x="108" y="523">Confirmation Bias</text>
    <path d="M344 515l5 5 5-5" fill="none" stroke="#202124" stroke-width="1.8"/>
    <line x1="69" y1="542" x2="363" y2="542" stroke="#cbd5e1"/>
    <use href="#thumb-down" x="78" y="554" width="23" height="23" color="#c5221f"/>
    <text x="108" y="573">Framing Effect</text>
    <path d="M344 565l5 5 5-5" fill="none" stroke="#202124" stroke-width="1.8"/>
  </g>
  <text x="69" y="625" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="650" fill="#0647f5">Add context for more accurate results ✎</text>

  <!-- Panel 2: score -->
  <g filter="url(#shadow)">
    <rect x="434" y="272" width="332" height="378" rx="17" fill="#e8edf3" stroke="#cbd5e1"/>
  </g>
  <path d="M451 272h298a17 17 0 0 1 17 17v31H434v-31a17 17 0 0 1 17-17Z" fill="#0647f5"/>
  <path d="M743 290l11 11m0-11-11 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="453" y="354" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="750" fill="#202124">Question impact</text>

  <rect x="453" y="374" width="294" height="125" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="503" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#30343b">Harmful</text>
  <text x="503" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#30343b">72%</text>
  <text x="697" y="407" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#30343b">Helpful</text>
  <text x="697" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#30343b">28%</text>
  <rect x="475" y="449" width="250" height="11" rx="5.5" fill="#d1d5db"/>
  <rect x="475" y="449" width="180" height="11" rx="5.5" fill="#ff4b3e"/>
  <circle cx="655" cy="454.5" r="9" fill="#ffffff" stroke="#ff4b3e" stroke-width="3"/>
  <text x="475" y="483" font-family="Inter, Arial, sans-serif" font-size="10" fill="#64748b">Combined likelihood and impact across detected biases</text>

  <text x="453" y="535" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#30343b">Bias contribution</text>
  <text x="453" y="562" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Leading Question</text>
  <rect x="573" y="554" width="153" height="8" rx="4" fill="#dbe3ed"/>
  <rect x="573" y="554" width="141" height="8" rx="4" fill="#ff4b3e"/>
  <text x="731" y="562" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#b91c1c">92</text>
  <text x="453" y="588" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Confirmation Bias</text>
  <rect x="573" y="580" width="153" height="8" rx="4" fill="#dbe3ed"/>
  <rect x="573" y="580" width="119" height="8" rx="4" fill="#fb923c"/>
  <text x="731" y="588" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#c2410c">78</text>
  <text x="453" y="614" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Framing Effect</text>
  <rect x="573" y="606" width="153" height="8" rx="4" fill="#dbe3ed"/>
  <rect x="573" y="606" width="98" height="8" rx="4" fill="#fbbf24"/>
  <text x="731" y="614" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#a16207">64</text>

  <!-- Panel 3: rephrase -->
  <g filter="url(#shadow)">
    <rect x="818" y="272" width="332" height="378" rx="17" fill="#e8edf3" stroke="#cbd5e1"/>
  </g>
  <path d="M835 272h298a17 17 0 0 1 17 17v31H818v-31a17 17 0 0 1 17-17Z" fill="#0647f5"/>
  <path d="M1127 290l11 11m0-11-11 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <path d="M844 354l-8 8 8 8" fill="none" stroke="#30343b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="858" y="368" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="750" fill="#202124">Rephrase Suggestions</text>
  <text x="1119" y="368" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="10" fill="#30343b">‹  1 of 2  ›</text>
  <line x1="836" y1="386" x2="1132" y2="386" stroke="#cbd5e1"/>

  <text x="836" y="409" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">ORIGINAL QUESTION</text>
  <rect x="836" y="418" width="296" height="55" rx="6" fill="#dfe6ea"/>
  <text x="847" y="439" font-family="Inter, Arial, sans-serif" font-size="11" font-style="italic" fill="#30343b">“Don’t you agree that our improved</text>
  <text x="847" y="456" font-family="Inter, Arial, sans-serif" font-size="11" font-style="italic" fill="#30343b">product is easier to use?”</text>

  <text x="836" y="501" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#047857">NEUTRAL REPHRASE</text>
  <rect x="836" y="511" width="296" height="82" rx="8" fill="#ffffff" stroke="#b8c3ce"/>
  <text x="848" y="536" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#202124">“What is your opinion on the</text>
  <text x="848" y="556" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650" fill="#202124">usability of our product?”</text>
  <circle cx="1090" cy="574" r="10" fill="#0647f5"/>
  <path d="M1086 574l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#thumb-down" x="1104" y="563" width="21" height="21" color="#c5221f"/>
  <rect x="836" y="608" width="296" height="25" rx="12.5" fill="#d1fae5"/>
  <circle cx="850" cy="620.5" r="6" fill="#10b981"/>
  <path d="M847 620l2 2 4-4" fill="none" stroke="#fff" stroke-width="1.4"/>
  <text x="862" y="624" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" fill="#047857">Reduced bias · clearer response</text>
</svg>
